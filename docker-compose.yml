services:
  backend:
    build: ./backend
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEYS=${GROQ_API_KEYS}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - MAX_LOOP_ITERATIONS=${MAX_LOOP_ITERATIONS:-5}
      - TOOL_TIMEOUT_SECONDS=${TOOL_TIMEOUT_SECONDS:-5}
      - GUARDRAIL_ENABLED=${GUARDRAIL_ENABLED:-true}
      - GUARDRAIL_MODEL=${GUARDRAIL_MODEL:-llama-3.3-70b-versatile}
      - APP_APP_ENV=${APP_APP_ENV:-production}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
    volumes:
      - db_data:/app/db
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
